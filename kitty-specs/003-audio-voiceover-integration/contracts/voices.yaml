openapi: 3.0.3
info:
  title: Voice Library API
  version: 1.0.0
paths:
  /api/v1/voices:
    get:
      summary: List available voices
      tags: [Voices]
      responses:
        '200':
          description: List of voices
          content:
            application/json:
              schema:
                type: object
                properties:
                  voices:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 'en-US-JennyNeural'
                        name:
                          type: string
                          example: 'Jenny (US English)'
                        language:
                          type: string
                          example: 'en-US'
                        gender:
                          type: string
                          enum: [male, female, neutral]
                        sampleUrl:
                          type: string
                          format: uri
  /api/v1/projects/{projectId}/voice:
    patch:
      summary: Set project voice
      tags: [Voices]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [voiceId]
              properties:
                voiceId:
                  type: string
      responses:
        '200':
          description: Voice updated
